name: Smoke (prod API)

# Пост-деплой смоук: проверяет здоровье БЭКЕНД-API прода (api.traektoriya.space).
# Запускается на push в main (после деплоя), вручную (кнопка Run workflow)
# и раз в 12 часов для мониторинга. Падает (красный X), если хоть один эндпоинт сломан.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run API smoke
        id: smoke
        env:
          # Логин и пароль смоук-админа — ТОЛЬКО из GitHub Secrets (в коде их нет).
          # Завести секреты: SMOKE_USER (напр. nmedov-admin) и SMOKE_PASSWORD (сильный).
          SMOKE_USER: ${{ secrets.SMOKE_USER }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          set -o pipefail
          python scripts/smoke/qa_check.py 2>&1 | tee smoke_out.txt

      # Лечение «сигнальной усталости» (аудит 2026-07-16: smoke был красным с 23.06,
      # и никто не видел): при провале — алерт владельцу в Telegram с именами ассертов.
      - name: Alert to Telegram on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          FAILS=$(grep -E "^\s*FAIL" smoke_out.txt | head -6 || echo "лог недоступен")
          curl -s -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="🟠 SMOKE ПРОДА КРАСНЫЙ ($(date -u '+%d.%m %H:%M UTC')):
          ${FAILS}
          Подробности: github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
