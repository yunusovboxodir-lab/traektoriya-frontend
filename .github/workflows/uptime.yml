name: Uptime (prod health)

# «Болевые рецепторы» платформы (аудит-организм 2026-07-16: прод лежал ~12ч из-за
# неоплаты VPS — никто не узнал). Каждые ~10 минут проверяет /health прод-API;
# при падении шлёт алерт владельцу в Telegram. Анти-спам: повторный алерт не чаще
# чем раз в час (маркер в GitHub Actions cache); при восстановлении — зелёное сообщение.
#
# Требуемые секреты репо: TELEGRAM_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  actions: write   # для управления cache-маркером алерта

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check /health (3 попытки)
        id: health
        run: |
          URL="https://api.traektoriya.space/health"
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -m 15 -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            echo "try$i http=$code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 20
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      # Маркер «уже алертили» живёт в cache: ключ содержит текущий час → повторный
      # алерт в тот же час не уходит, в следующий час — уходит снова (раз в час).
      - name: Restore alert marker
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .alert_marker
          key: uptime-alert-${{ github.run_id }}
          restore-keys: uptime-alert-

      - name: Alert to Telegram (DOWN)
        if: steps.health.outputs.ok == '0'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          HOUR=$(date -u +%Y%m%d%H)
          LAST=$(cat .alert_marker 2>/dev/null || echo none)
          if [ "$LAST" = "down-$HOUR" ]; then
            echo "Алерт в этом часе уже отправлен — пропуск (анти-спам)"; exit 0
          fi
          curl -s -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="🔴 ПРОД НЕДОСТУПЕН: api.traektoriya.space/health не отвечает (3 попытки). Проверь панель Eskiz (vps10274) / SSH. $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "down-$HOUR" > .alert_marker

      - name: Recovery message (UP после падения)
        if: steps.health.outputs.ok == '1'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          LAST=$(cat .alert_marker 2>/dev/null || echo none)
          case "$LAST" in
            down-*)
              curl -s -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d chat_id="${TG_CHAT}" \
                -d text="🟢 Прод восстановился: /health снова 200. $(date -u '+%Y-%m-%d %H:%M UTC')"
              ;;
          esac
          echo "up" > .alert_marker

      - name: Save alert marker
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert_marker
          key: uptime-alert-${{ github.run_id }}

      - name: Fail run if down
        if: steps.health.outputs.ok == '0'
        run: exit 1
