name: VPS billing reminder

# Напоминание об оплате VPS Eskiz (урок 2026-07-16: VPS приостановили за неоплату
# в ночь на 16-е — прод лежал ~12 часов). Шлёт владельцу TG-сообщение 12-го числа
# каждого месяца, за несколько дней до цикла оплаты.
#
# Требуемые секреты репо: TELEGRAM_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 12 * *'   # 12-е число, 05:00 UTC = 10:00 Ташкент

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send reminder
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          curl -s -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="💳 Напоминание: проверь оплату VPS Eskiz (vps10274, 185.217.131.198). 16.07.2026 прод лежал ~12ч из-за приостановки за неоплату."
